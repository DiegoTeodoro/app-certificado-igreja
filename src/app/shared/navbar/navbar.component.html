<header class="navbar">
  <div class="navbar__left">

      class="navbar__icon"
      src="/assets/icons/certificado.png"
      alt="Certificado"
    />

    <span class="navbar__title">
      Sistema de Cursos e Certificados
    </span>
  </div>

  <div class="navbar__right">

    <span class="usuario-logado">
      Olá, {{ nomeUsuario }}
    </span>

    <button
      type="button"
      class="btn-sair"
      (click)="logout()">
      Sair
    </button>

  </div>
</header>
